name: bluemira-eudemo

on:
  schedule:
    # Runs twice a day at 7.05 and 12.05 Monday to Friday
    - cron: "5 7,12 * * 1-5"
  pull_request:
  push:
    branches:
      - develop
      - main
      - test-build-action # temp

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup python and hatch
        uses: Fusion-Power-Plant-Framework/fppf-actions/setup-hatch@main

      - name: Run Hatch linting tasks
        uses: Fusion-Power-Plant-Framework/fppf-actions/hatch-lint@main

      - name: Show ruff modifications
        if: failure()
        run: |
          ruff --version
          echo "Changed files:"
          git status
          echo "Diff:"
          git diff

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout bluemira
        uses: actions/checkout@v4
        with:
          repository: "Fusion-Power-Plant-Framework/bluemira"

      - name: Build bluemira
        uses: Hudsonbaker4/fppf-actions/build-action@build-action
        with:
          os: ubuntu-latest

      - name: Run pytest
        shell: bash -l {0}
        env:
          PACKAGE: eudemo
        run: |
          pytest --cov=${PACKAGE} \
                 --cov-report html:htmlcov \
                 --cov-report xml \
                 --json-report \
                 --json-report-indent=3 \
                 tests
