name: bluemira-eudemo

on:
  schedule:
    # Runs twice a day at 7.05 and 12.05 Monday to Friday
    - cron: "5 7,12 * * 1-5"
  pull_request:
  push:
    branches:
      - develop
      - main
      - test-build-action # temp

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup python and hatch
        uses: Hudsonbaker4/fppf-actions/setup-hatch@build-action

      - name: Run Hatch linting tasks
        uses: Hudsonbaker4/fppf-actions/hatch-lint@build-action

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bluemira
        uses: Hudsonbaker4/fppf-actions/build-action@build-action
        with:
          python-version: "3.11"
          clone-bluemira: "true"

      - name: Run pytest
        shell: bash -l {0}
        env:
          PACKAGE: eudemo
        run: |
          pytest --cov=${PACKAGE} \
                 --cov-report html:htmlcov \
                 --cov-report xml \
                 --json-report \
                 --json-report-indent=3 \
                 tests
